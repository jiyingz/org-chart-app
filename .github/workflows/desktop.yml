# Builds the Mac app (.dmg) on GitHub's Mac machines, so you don't need Rust or Xcode installed.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
# The .dmg appears under the run's "Artifacts" (and on the Release page for tags).
name: Mac app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      # Works on both Apple Silicon and Intel Macs.
      - run: npx tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: OrgMap-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
